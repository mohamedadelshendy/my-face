name: Build Biometric Lock EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install Build Tools (CMake)
      run: |
        pip install cmake

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Build Standalone Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name BiometricLock --collect-data face_recognition_models biometric_lock.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BiometricLock-Windows
        path: dist/BiometricLock.exe
